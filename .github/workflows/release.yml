name: Release to maven central
on:
  push:
    branches:
      - "!*"
    tags:
      - "v*"
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-14-xlarge, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    env:
      SIGN_KEY: ${{ secrets.SIGN_KEY }}
      SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788
        with:
          servers: |
            [{
                "id": "central",
                "username": "${{ secrets.CENTRAL_TOKEN_USERNAME }}",
                "password": "${{ secrets.CENTRAL_TOKEN_PASSWORD }}"
            }]
      - name: Deploy to central
        run: mvn --batch-mode deploy